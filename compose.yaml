name: ids-lab

services:
  victim:
    build:
      context: .
      dockerfile: docker/victim/Dockerfile
    image: ids-lab/victim:dev
    container_name: ids-lab-victim
    hostname: victim
    init: true
    read_only: true
    # Writable scratch space for the few paths nginx and sshd need at runtime.
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx
    # Drop everything, then add back only what nginx and sshd need to start:
    # binding ports 22 and 80, switching to unprivileged users, and chroot.
    cap_drop: [ALL]
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID, SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      lab:
        ipv4_address: 172.30.0.10

  benign:
    build:
      context: .
      dockerfile: docker/benign/Dockerfile
    image: ids-lab/benign:dev
    container_name: ids-lab-benign
    hostname: benign
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      # Throwaway password of the victim's lab account, which only exists
      # inside the isolated network.
      LAB_SSH_PASSWORD: sunshine
    # A fixed seed makes the benign traffic reproducible from one run to the next.
    command: ["--target", "victim", "--seed", "42"]
    depends_on:
      victim:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.30.0.20

  attacker:
    build:
      context: .
      dockerfile: docker/attacker/Dockerfile
    image: ids-lab/attacker:dev
    container_name: ids-lab-attacker
    hostname: attacker
    init: true
    read_only: true
    tmpfs:
      - /tmp
    # Runs as root: nmap's SYN scan and hping3 need raw-socket access, which
    # a non-root user cannot get from cap_add alone without extra setup.
    # Every other control still applies: all capabilities are dropped except
    # the two raw-networking ones, the container cannot gain new privileges,
    # and it never starts automatically (see "profiles" below).
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Only runs when explicitly requested (`--profile attack`), never as
    # part of a plain `docker compose up`.
    profiles: ["attack"]
    working_dir: /work
    volumes:
      - .:/work:ro
      - ./data/raw:/work/data/raw:rw
    depends_on:
      victim:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.30.0.30

networks:
  # internal: true gives the containers no route to the internet or to the host
  # network. This is what keeps the attack traffic inside the lab.
  lab:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
